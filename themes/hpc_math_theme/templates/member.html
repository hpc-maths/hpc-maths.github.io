{% macro content(page) %}

<section id="event-details" class="event-details">
    <div class="container">
        <h1 class="page_title">{{page.firstname}} {{page.lastname}}</h1>
        <ul>
            <li><strong>Fonction :</strong> {{ page.fonction }}</li>
        </ul>
    </div>
    <div class="container">

        <div class="row gy-4">

            {{ page.content }}

        </div>
    </div>
</section>

{% endmacro %}
